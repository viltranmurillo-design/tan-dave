<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Concrete street wall banner">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1e26"/>
      <stop offset="50%" stop-color="#101319"/>
      <stop offset="100%" stop-color="#0a0b0f"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#f7b32b" opacity="0.16"/>
    </pattern>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7b32b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f7b32b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f7b32b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="640" fill="url(#wall)"/>
  <rect width="1920" height="640" fill="url(#dots)"/>

  <g opacity="0.22">
    <path d="M-60 640 700 0 900 0 140 640Z" fill="#2a303c"/>
    <path d="M1200 640 1960 0 2120 0 1360 640Z" fill="#1e222c"/>
  </g>

  <g opacity="0.85">
    <rect x="0" y="430" width="1920" height="6" fill="url(#stripe)"/>
  </g>

  <g opacity="0.5" fill="#0a0b0e">
    <rect x="0" y="520" width="1920" height="120"/>
  </g>

  <g font-family="Arial Black, Arial, sans-serif" fill="#f7b32b" opacity="0.1" font-size="180" letter-spacing="14">
    <text x="60" y="200">SOLID MOVEMENT</text>
  </g>

  <g stroke="#e2543c" stroke-width="8" opacity="0.6" stroke-linecap="square">
    <path d="M1560 180 1740 180"/>
    <path d="M1560 214 1680 214"/>
  </g>
</svg>
