<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bugoy na Koykoy street movement banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d212a"/>
      <stop offset="45%" stop-color="#101319"/>
      <stop offset="100%" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7b32b" stop-opacity="0"/>
      <stop offset="35%" stop-color="#f7b32b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f7b32b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#f7b32b" opacity="0.2"/>
    </pattern>
    <pattern id="dotsDark" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#e2543c" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1920" height="900" fill="url(#sky)"/>
  <rect width="1920" height="900" fill="url(#dots)"/>

  <g opacity="0.28">
    <path d="M-100 700 900 100 1180 100 -180 700Z" fill="#2a303c"/>
    <path d="M900 900 1900 300 2120 300 1120 900Z" fill="#1d212b"/>
  </g>

  <g opacity="0.9">
    <rect x="0" y="612" width="1920" height="7" fill="url(#gold)"/>
  </g>

  <g opacity="0.45" fill="#0a0b0e">
    <rect x="90" y="520" width="120" height="290"/>
    <rect x="240" y="440" width="90" height="370"/>
    <rect x="360" y="560" width="140" height="250"/>
    <rect x="530" y="380" width="100" height="430"/>
    <rect x="660" y="500" width="160" height="310"/>
    <rect x="1500" y="470" width="110" height="340"/>
    <rect x="1640" y="540" width="150" height="270"/>
    <rect x="1820" y="430" width="90" height="380"/>
  </g>

  <g opacity="0.85">
    <rect x="0" y="770" width="1920" height="130" fill="#0a0b0e"/>
    <path d="M0 770h1920" stroke="#2d323d" stroke-width="3"/>
  </g>

  <g font-family="Arial Black, Arial, sans-serif" fill="none" stroke="#f7b32b" stroke-width="4" opacity="0.55">
    <circle cx="1560" cy="210" r="118"/>
    <circle cx="1560" cy="210" r="86"/>
  </g>

  <g font-family="Arial Black, Arial, sans-serif" fill="#f7b32b" opacity="0.12" font-size="330" letter-spacing="26">
    <text x="1090" y="620">BNK</text>
  </g>

  <g opacity="0.5">
    <rect x="1100" y="0" width="220" height="900" fill="url(#dotsDark)"/>
  </g>

  <g stroke="#e2543c" stroke-width="10" opacity="0.75" stroke-linecap="square">
    <path d="M1360 640 1500 640"/>
  </g>
</svg>
